<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('tylerTheme') || 'dark'; } catch (e) {}
  if (t === 'auto') { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  try { if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f3ee'); } catch (e) {}
})();
</script>
<title>Tyler App</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tyler App">
<style>
:root{color-scheme:dark;--bg:#0b0f17;--text:#f3f4f6;--muted:#9ca3af;--gold:#ffd277;--on-gold:#0b0f17;--field:#141a26;--fbd:#2a3344;--line:rgba(255,255,255,.06);--err:#ff8a80}
html[data-theme=light]{color-scheme:light;--bg:#f6f3ee;--text:#1b1f2a;--muted:#6b7280;--gold:#f2c14e;--on-gold:#241a00;--field:#fbfaf7;--fbd:#d9d2c5;--line:rgba(20,16,8,.08);--err:#d93a52}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);box-sizing:border-box}
.m{width:72px;height:72px;display:block}
h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:600;margin:14px 0 16px}
.sweep{position:relative;width:120px;height:2px;overflow:hidden;margin:0 0 22px;border-radius:1px;background:var(--line)}
.sweep:after{content:"";position:absolute;left:0;top:0;height:2px;width:35%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slide 1.1s linear infinite}
form[style*="display: block"]~.sweep{display:none}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.sweep:after{animation:none;width:100%}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#s:empty{display:none}
form{width:100%;max-width:320px;display:none}
input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--fbd);background:var(--field);color:var(--text)}
button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:12px;background:var(--gold);color:var(--on-gold);font-size:16px;font-weight:600}
#e{color:var(--err);font-size:14px;min-height:18px;margin-top:10px;text-align:center}
#s{color:var(--muted);font-size:14px;margin-top:6px;text-align:center}
</style>
</head>
<body>
<svg class="m" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0f17" stroke="rgba(255,255,255,.14)" stroke-width="1"/><path d="M8 9.5h16M16 9.5V24" stroke="#ffd277" stroke-width="3.2" stroke-linecap="round" fill="none"/></svg>
<h1>Tyler App</h1>
<form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit">Unlock</button><div id="e"></div></form>
<div class="sweep" role="status"><span class="sr-only">Opening…</span></div>
<div id="s"></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwubhWYG0ZPxF9hkoxq0Brd5Bz4Zz7vD037vIrfTHOzqHrLbIRrVs1S4c6EVKBWobpt/exec';
  var $ = function (i) { return document.getElementById(i); };
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* quota or blocked */ } }
  function show(pw) { $('s').textContent = ''; $('f').style.display = 'block'; if (pw) $('e').textContent = pw; try { $('p').focus(); } catch (e) { } }
  function status(t) { $('s').textContent = t; }
  function api(pw, have) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'getPage', args: [have || '', pw], pw: pw }), redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }
  function write(html) { document.open(); document.write(html); document.close(); }
  function store(r) {
    put('page:html', r.html); put('page:hash', r.hash); put('page:at', String(Date.now()));
  }
  function rejected(r) {
    put('tylerPw', null);
    $('e').textContent = '';
    show(r.msg || 'Wrong password');
    if (r.msg) status(r.msg);
  }
  function start(pw) {
    var html = get('page:html'), hash = get('page:hash');
    if (html && hash) {
      // instant launch from cache; refresh for next time in the background
      api(pw, hash).then(function (r) {
        if (r && r.ok && r.html && r.hash) store(r);
        else if (r && r.auth === false) put('tylerPw', null);
      }).catch(function () { });
      write(html);
      return;
    }
    status('Opening…');
    api(pw, '').then(function (r) {
      if (r && r.auth === false) { rejected(r); return; }
      if (r && r.ok && r.html) { store(r); write(r.html); return; }
      status((r && r.msg) || 'Could not open the app');
    }).catch(function () { status('No connection and nothing saved yet'); });
  }
  try {
    var q = /[?&]pw=([^&]*)/.exec(location.search);
    if (q) { put('tylerPw', decodeURIComponent(q[1])); try { history.replaceState(null, '', location.pathname); } catch (e) { } }
  } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { }
  }
  // Defer until this document has finished parsing: document.open()/write() during parsing would
  // append the app under the loader instead of replacing it.
  setTimeout(function () {
    var pw = get('tylerPw');
    if (pw) start(pw);
    else show();
  }, 0);
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = $('p').value.trim();
    if (!v) { $('e').textContent = 'Type the password'; return; }
    $('e').textContent = ''; put('tylerPw', v); $('f').style.display = 'none'; status('Opening…');
    start(v);
  });
})();
</script>
</body>
</html>
